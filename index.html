<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07101f">
<title>AstroLogs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg-deep:    #070a12;
  --bg-panel:   #0c1020;
  --bg-card:    #0f1628;
  --bg-hover:   #161e32;
  --border:     #1a2640;
  --border-light: #203050;
  --accent:     #c9932a;
  --accent2:    #e8b84b;
  --gold:       #e8b84b;
  --teal:       #2dd4bf;
  --text:       #e2e8f0;
  --text-muted: #556070;
  --text-dim:   #8090a8;
  --success:    #22c55e;
  --danger:     #ef4444;
  --warning:    #f59e0b;
  --sidebar-w:  260px;
  --header-h:   64px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0;padding:0}
body{font-family:'Raleway',sans-serif;background:var(--bg-deep);color:var(--text);font-weight:400;letter-spacing:.01em}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  height:100vh;
  background:linear-gradient(180deg,#06080f 0%,#080c14 60%,#06080f 100%);
  border-right:1px solid rgba(200,155,50,.2);
  display:flex;flex-direction:column;
  overflow:hidden;
  position:relative;z-index:20;
}
.sidebar-logo{
  flex-shrink:0;
  border-bottom:1px solid rgba(200,155,50,.15);
}

.nav-group{padding:8px 10px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-group::-webkit-scrollbar{width:3px}
.nav-group::-webkit-scrollbar-thumb{background:rgba(200,155,50,.2);border-radius:2px}

.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:9px 12px;border-radius:9px;
  cursor:pointer;transition:all .18s;
  font-size:13.5px;font-weight:500;
  color:rgba(200,155,50,.55);
  margin-bottom:2px;white-space:nowrap;
}
.nav-item:hover{
  background:rgba(200,155,50,.08);
  color:rgba(200,155,50,.9);
}
.nav-item.active{
  background:rgba(200,155,50,.12);
  color:#e8b84b;
  border-radius:9px;
}
.nav-item .nav-icon{
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.nav-item svg{
  color:inherit;stroke:currentColor;
}
.nav-badge{
  margin-left:auto;
  background:linear-gradient(135deg,#c9932a,#e8b84b);
  color:#06080f;
  font-size:10px;font-weight:700;border-radius:10px;
  padding:1px 7px;
}

.sidebar-user{
  padding:14px 16px;
  border-top:1px solid rgba(200,155,50,.18);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.user-avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,#c9932a,#e8b84b);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#06080f;flex-shrink:0;
  box-shadow:0 0 10px rgba(200,155,50,.3);
}
.user-name{font-size:13px;font-weight:600;color:#e8b84b}
.user-role{font-size:11px;color:rgba(200,155,50,.5)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.topbar{
  height:var(--header-h);background:var(--bg-panel);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;flex-shrink:0;
}
.page-title{font-family:'Cinzel',serif;font-size:14px;font-weight:500;letter-spacing:.14em;color:#e8b84b;text-transform:uppercase}
.page-sub{font-size:11px;color:rgba(200,155,50,.45);margin-top:3px;font-weight:300;letter-spacing:.06em}

.topbar-actions{display:flex;align-items:center;gap:12px}
.topbar-btn{
  width:36px;height:36px;border-radius:8px;
  background:var(--bg-card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-dim);font-size:16px;
  transition:all .18s;
}
.topbar-btn:hover{border-color:var(--accent);color:var(--accent)}
.lang-toggle{
  display:flex;gap:4px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:8px;padding:3px;
}
.lang-btn{
  padding:3px 10px;border-radius:5px;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .18s;color:var(--text-muted);
}
.lang-btn.active{background:var(--accent);color:#fff}

.content{flex:1;overflow-y:auto;padding:24px 28px}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

/* ── ADD OBS BUTTON ── */
.fab{
  position:fixed;bottom:28px;right:28px;z-index:100;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;cursor:pointer;font-size:24px;color:#fff;
  box-shadow:0 4px 20px rgba(124,109,250,.5);
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s,box-shadow .2s;
}
.fab:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(124,109,250,.7)}

/* ── CARDS ── */
.card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:14px;padding:20px;
}
.card-title{
  font-family:'Cinzel',serif;
  font-size:12px;font-weight:500;margin-bottom:16px;
  color:#e8b84b;letter-spacing:.12em;text-transform:uppercase;
}

/* ── KPI CARDS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:14px;padding:22px 22px;
  display:flex;align-items:center;gap:16px;
  transition:border-color .2s, box-shadow .2s;
  cursor:pointer;min-height:100px;
}
.kpi-card:hover{
  border-color:rgba(200,155,50,.65);
  box-shadow:0 0 22px rgba(200,155,50,.15),inset 0 0 16px rgba(200,155,50,.03);
}
.kpi-card:hover .kpi-label{
  color:#e8b84b !important;
  letter-spacing:.12em;
  text-shadow:0 0 14px rgba(232,184,75,.8);
}
.kpi-card:hover .kpi-val{
  color:#f5d78e;
  text-shadow:0 0 10px rgba(232,184,75,.4);
}
.kpi-icon{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.kpi-val{font-family:'Raleway',sans-serif;font-size:22px;font-weight:300;line-height:1;color:var(--text)}
.kpi-label{font-size:10px;color:rgba(200,155,50,.5);margin-bottom:4px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.kpi-delta{font-size:11px;color:var(--success);margin-top:3px}

/* ── GRIDS ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

/* ── LAST OBS CARD ── */
.last-obs-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;
}
.last-obs-img{
  width:100%;height:200px;object-fit:cover;
  background:linear-gradient(135deg,#1a0533,#0d1a2e);
  display:flex;align-items:center;justify-content:center;
  font-size:60px;
}
.last-obs-img img{width:100%;height:100%;object-fit:cover}
.last-obs-body{padding:16px}
.last-obs-name{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;margin-bottom:4px}
.last-obs-cat{font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.last-obs-meta{display:flex;gap:14px;flex-wrap:wrap}
.meta-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim)}

/* ── CHART CONTAINER ── */
.chart-wrap{position:relative;height:260px}

/* ── COND NOITE ── */
.cond-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.cond-row:last-child{border-bottom:none}
.cond-label{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-dim);font-family:'Raleway',sans-serif;letter-spacing:.04em}
.cond-val{font-size:12.5px;font-weight:600;font-family:'Raleway',sans-serif}
.indice-circle{
  width:90px;height:90px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:conic-gradient(var(--teal) 0% 82%,var(--border) 82% 100%);
  margin:0 auto;
}
.indice-inner{
  width:74px;height:74px;border-radius:50%;
  background:var(--bg-card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.indice-val{font-size:20px;font-weight:600;font-family:'Cinzel',serif;color:#e8b84b}
.indice-lbl{font-size:9px;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase}

/* ── TOP OBJECTS ── */
.top-obj-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.top-obj-row:last-child{border-bottom:none}
.top-obj-num{width:20px;font-size:12px;color:var(--text-muted);font-weight:600;flex-shrink:0}
.top-obj-name{flex:1;font-size:13px}
.top-obj-count{font-size:13px;font-weight:600;color:var(--accent2)}

/* ── EVENTS ── */
.event-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.event-row:last-child{border-bottom:none}
.event-icon{
  width:34px;height:34px;border-radius:8px;
  background:var(--bg-hover);display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0;
}
.event-name{font-size:13px;font-weight:500}
.event-date{font-size:11px;color:var(--text-muted);margin-top:2px}
.event-date-right{font-size:11px;color:var(--accent);margin-left:auto;flex-shrink:0}

/* ── OBS CARDS ── */
.obs-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;cursor:pointer;
  transition:border-color .2s,transform .2s;
}
.obs-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.obs-card-img{
  width:100%;height:140px;
  background:linear-gradient(135deg,#1a0533,#0d1a2e);
  display:flex;align-items:center;justify-content:center;
  font-size:48px;overflow:hidden;
}
.obs-card-img img{width:100%;height:100%;object-fit:cover}
.obs-card-body{padding:14px}
.obs-card-name{font-weight:500;font-size:13px;margin-bottom:4px;color:var(--text);font-family:'Raleway',sans-serif}
.obs-card-type{font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.obs-card-meta{font-size:11px;color:var(--text-muted)}
.obs-star{color:var(--gold);float:right}

/* ── STARS DISPLAY ── */
.stars{color:var(--gold);letter-spacing:1px}

/* ── TYPE BADGE ── */
.badge{
  display:inline-block;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.04em;
}
.badge-star    {background:rgba(240,180,41,.15);color:#f0b429}
.badge-galaxy  {background:rgba(124,109,250,.15);color:#a78bfa}
.badge-nebula  {background:rgba(236,72,153,.15);color:#f472b6}
.badge-cluster {background:rgba(45,212,191,.15);color:#2dd4bf}
.badge-planet  {background:rgba(249,115,22,.15);color:#fb923c}
.badge-other   {background:rgba(100,116,139,.15);color:#94a3b8}
.badge-moon    {background:rgba(148,163,184,.15);color:#cbd5e1}
.badge-comet   {background:rgba(34,211,238,.15);color:#22d3ee}

/* ── FILTERS BAR ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filter-btn{
  padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;
  background:var(--bg-card);border:1px solid var(--border);
  color:var(--text-dim);cursor:pointer;transition:all .18s;
}
.filter-btn:hover,.filter-btn.active{
  background:rgba(124,109,250,.18);border-color:var(--accent);color:#fff;
}
.search-box{
  flex:1;min-width:160px;max-width:280px;
  display:flex;align-items:center;gap:8px;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:8px;padding:6px 12px;
}
.search-box input{
  background:none;border:none;outline:none;color:var(--text);
  font-size:13px;width:100%;
}
.search-box input::placeholder{color:var(--text-muted)}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;
  z-index:200;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--bg-card);border:1px solid var(--border-light);
  border-radius:18px;width:100%;max-width:560px;
  max-height:90vh;overflow-y:auto;
  transform:translateY(20px);transition:transform .2s;
}
.modal-overlay.open .modal{transform:translateY(0)}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:2px}
.modal-header{
  padding:20px 24px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-between;
  position:sticky;top:0;background:var(--bg-card);z-index:1;
}
.modal-title{font-family:'Cinzel',serif;font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#e8b84b}
.modal-close{
  background:none;border:none;color:var(--text-muted);
  font-size:22px;cursor:pointer;line-height:1;margin-left:auto;
  transition:color .15s;
}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px 24px}

/* ── FORM ── */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.form-input,.form-select,.form-textarea{
  width:100%;background:var(--bg-panel);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;font-size:14px;color:var(--text);
  outline:none;transition:border-color .18s;font-family:'Inter',sans-serif;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-select option{background:var(--bg-panel)}
.form-textarea{resize:vertical;min-height:80px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-row{display:flex;gap:10px}
.form-row .form-input{flex:1}

.btn{
  padding:8px 16px;border-radius:8px;font-size:11.5px;font-weight:500;
  cursor:pointer;border:none;transition:all .18s;font-family:'Raleway',sans-serif;letter-spacing:.06em;
}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.88;transform:translateY(-1px)}
.btn-secondary{background:var(--bg-hover);border:1px solid var(--border);color:var(--text-dim)}
.btn-secondary:hover{border-color:var(--accent);color:var(--text)}
.btn-danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--danger)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ── AUTOFILL BUTTON ── */
.autofill-btn{
  padding:9px 14px;border-radius:8px;background:rgba(124,109,250,.18);
  border:1px solid var(--accent);color:var(--accent);font-size:13px;
  font-weight:600;cursor:pointer;white-space:nowrap;transition:all .18s;
}
.autofill-btn:hover{background:rgba(124,109,250,.28)}
.autofill-btn:disabled{opacity:.5;cursor:wait}

/* ── SECTION HEADER ── */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
}
.section-title{font-family:'Cinzel',serif;font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#e8b84b}
.section-link{font-size:13px;color:var(--accent);cursor:pointer;transition:opacity .15s}
.section-link:hover{opacity:.75}

/* ── CALENDAR ── */
.cal-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cal-nav{background:var(--bg-hover);border:1px solid var(--border);border-radius:7px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--text-dim);transition:all .15s}
.cal-nav:hover{border-color:var(--accent);color:var(--accent)}
.cal-month{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-label{text-align:center;font-size:11px;font-weight:600;color:var(--text-muted);padding:4px 0;letter-spacing:.06em}
.cal-day{
  min-height:62px;border-radius:7px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;font-size:12px;
  cursor:pointer;transition:all .15s;position:relative;
  padding:5px 3px;
}
.cal-day:hover{background:var(--bg-hover)}
.cal-day.today{background:var(--accent);color:#fff;font-weight:700}
/* dots now rendered inline in JS */
.cal-day.selected{background:rgba(124,109,250,.25);border:1px solid var(--accent)}
.cal-day.empty{cursor:default}

/* ── STATS BARS ── */
.stat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stat-bar-label{width:70px;font-size:12px;color:var(--text-dim);text-align:right;flex-shrink:0}
.stat-bar-track{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.stat-bar-num{width:24px;font-size:12px;color:var(--text);text-align:right;flex-shrink:0}

/* ── LOCATIONS ── */
.loc-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  padding:16px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:border-color .18s;
}
.loc-card:hover{border-color:var(--accent)}
.loc-icon{font-size:24px}
.loc-name{font-weight:600;font-size:14px}
.loc-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.loc-count{margin-left:auto;text-align:right}
.loc-count-num{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--accent2)}
.loc-count-lbl{font-size:11px;color:var(--text-muted)}

/* ── GALLERY ── */
.gal-card{border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:transform .18s,border-color .18s,box-shadow .18s}
.gal-card:hover{transform:translateY(-3px);border-color:rgba(200,155,50,.45);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.gal-img-wrap{position:relative;aspect-ratio:1;background:var(--bg-card);overflow:hidden}
.gal-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,transparent 55%);opacity:0;transition:opacity .2s;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.gal-card:hover .gal-overlay{opacity:1}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gallery-item{
  border-radius:12px;overflow:hidden;aspect-ratio:1;
  background:var(--bg-hover);cursor:pointer;position:relative;
  border:1px solid var(--border);transition:transform .2s,border-color .2s;
}
.gallery-item:hover{transform:scale(1.02);border-color:var(--accent)}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px}
.gallery-overlay{
  position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 50%);
  opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;padding:10px;
}
.gallery-item:hover .gallery-overlay{opacity:1}
.gallery-overlay-text{font-size:12px;font-weight:600;color:#fff}

/* ── WISHLIST ── */
.wish-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;
  transition:border-color .18s;
}
.wish-card:hover{border-color:var(--border-light)}
.priority-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.priority-high{background:#ef4444}
.priority-medium{background:#f59e0b}
.priority-low{background:#22c55e}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:90px;right:24px;z-index:300;
  padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;
  background:var(--bg-card);border:1px solid var(--border);
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  transform:translateX(120%);transition:transform .3s;
}
.toast.show{transform:translateX(0)}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}

/* ── DETAIL MODAL ── */
.detail-img{
  width:100%;height:220px;object-fit:cover;
  background:linear-gradient(135deg,#1a0533,#0d1a2e);
  display:flex;align-items:center;justify-content:center;
  font-size:72px;overflow:hidden;border-radius:12px;margin-bottom:16px;
}
.detail-img img{width:100%;height:100%;object-fit:cover}
.detail-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;
}
.detail-row:last-child{border-bottom:none}
.detail-key{color:var(--text-dim)}
.detail-val{font-weight:500}

/* ── OBJECT CATALOG ── */
.cat-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  padding:18px;text-align:center;cursor:pointer;transition:all .2s;
}
.cat-card:hover{border-color:var(--accent);background:var(--bg-hover)}
.cat-icon{font-size:40px;margin-bottom:10px}
.cat-name{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin-bottom:4px}
.cat-desc{font-size:11px;color:var(--text-muted);line-height:1.5}

/* ── ISS ── */
.iss-map{
  width:100%;height:300px;background:linear-gradient(135deg,#0a1628,#0d2040);
  border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--border);
}
.iss-grid-lines{position:absolute;inset:0;opacity:.15}
.iss-marker{position:absolute;transform:translate(-50%,-50%);font-size:24px;filter:drop-shadow(0 0 8px #22d3ee)}
.iss-data-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.iss-data-row:last-child{border-bottom:none}

/* ── SETTINGS ── */
.setting-group{margin-bottom:24px}
.setting-group-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:12px}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid var(--border);
}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:14px}
.setting-desc{font-size:12px;color:var(--text-muted);margin-top:2px}

/* ── TOGGLE ── */
.toggle{position:relative;width:40px;height:22px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{
  position:absolute;inset:0;background:var(--border);border-radius:11px;
  transition:.3s;
}
.toggle input:checked + .toggle-track{background:var(--accent)}
.toggle-thumb{
  position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;
  top:3px;left:3px;transition:.3s;
}
.toggle input:checked ~ .toggle-thumb{left:21px}

/* ── EMPTY STATE ── */
.empty{
  text-align:center;padding:60px 20px;color:var(--text-muted);
}
.empty-icon{font-size:56px;margin-bottom:14px;opacity:.6}
.empty-text{font-size:15px;margin-bottom:6px;color:var(--text-dim)}
.empty-sub{font-size:13px}

/* ── DROPDOWN ── */
.dropdown-wrap{position:relative;display:inline-block}
.dropdown{
  position:absolute;right:0;top:calc(100% + 6px);
  background:var(--bg-panel);border:1px solid var(--border-light);
  border-radius:10px;min-width:140px;z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  display:none;
}
.dropdown.open{display:block}
.dropdown-item{
  padding:9px 14px;font-size:13px;cursor:pointer;
  transition:background .15s;
}
.dropdown-item:hover{background:var(--bg-hover)}

/* ── NIGHT MODE OVERLAY ── */
.night-overlay{
  position:fixed;inset:0;background:rgba(120,0,0,.25);pointer-events:none;z-index:500;
  mix-blend-mode:multiply;display:none;
}
.night-overlay.active{display:block}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .sidebar{width:60px;min-width:60px}
  .sidebar .logo-text,.sidebar .nav-item span:not(.nav-icon),.sidebar .user-name,.sidebar .user-role,.sidebar .nav-badge{display:none}
  .sidebar .logo-icon{margin:0 auto}
  .sidebar-logo{justify-content:center;padding:14px 8px}
  .sidebar-user{justify-content:center}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
}
@media(max-width:600px){
  .content{padding:14px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .topbar{padding:0 14px}
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-content{animation:fadeIn .25s ease}

.wiki-link{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:8px;background:rgba(200,155,50,.1);border:1px solid rgba(200,155,50,.3);color:#e8b84b;font-size:13px;font-weight:600;text-decoration:none;font-family:'Cinzel',serif;letter-spacing:.08em;transition:background .18s}
.wiki-link:hover{background:rgba(200,155,50,.22)}
/* star background */
.stars-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 20% 30%,rgba(180,140,40,.04) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 70%,rgba(180,140,40,.02) 0%,transparent 50%);
}
.main,.sidebar{position:relative;z-index:1}
.content{position:relative;z-index:2}

/* Year dropdown */
.year-select{
  background:var(--bg-hover);border:1px solid var(--border);border-radius:7px;
  color:var(--text);font-size:13px;padding:4px 10px;outline:none;cursor:pointer;
}
</style>
</head>

function t(k){ return (i18n[lang]||i18n.pt)[k] || k; }

function setLang(l){
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === l.toUpperCase());
  });
  document.querySelectorAll('[data-i18n]').forEach(el => {

    if(t(k)) el.textContent = t(k);
  });
  navigate(currentPage);
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function save(){ localStorage.setItem('observations', JSON.stringify(observations)); }
function saveWL(){ localStorage.setItem('wishlist', JSON.stringify(wishlist)); }

function toast(msg, type='success'){
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3500);
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function toggleNight(){
  nightMode = !nightMode;
  document.getElementById('nightOverlay').classList.toggle('active', nightMode);
}

function typeIcon(t, size){
  size = size || 32;
  const icons = size <= 22 ? OBJ_ICONS_SM : OBJ_ICONS;
  const src = (icons && icons[t]) ? icons[t] : (OBJ_ICONS['other']||'');
  return src ? '<img src="'+src+'" style="width:'+size+'px;height:'+size+'px;object-fit:contain;vertical-align:middle">' : '🔭';
}
function typeBadgeClass(t){
  const m = {star:'badge-star',galaxy:'badge-galaxy',nebula:'badge-nebula',cluster:'badge-cluster',planet:'badge-planet',moon:'badge-moon',comet:'badge-comet',other:'badge-other'};
  return m[t]||'badge-other';
}
function typeLabel(t){
  const m = {
    pt:{star:'Estrela',galaxy:'Galáxia',nebula:'Nebulosa',cluster:'Aglomerado',planet:'Planeta',moon:'Lua',comet:'Cometa',other:'Outro'},
    en:{star:'Star',galaxy:'Galaxy',nebula:'Nebula',cluster:'Cluster',planet:'Planet',moon:'Moon',comet:'Comet',other:'Other'}
  };
  return (m[lang]||m.pt)[t]||t;
}
function starsDisp(n, max=5){ return '★'.repeat(parseInt(n)||0)+'☆'.repeat(max-(parseInt(n)||0)); }
function seeingLbl(v){ return ['','Muito Mau','Mau','Razoável','Bom','Excelente'][parseInt(v)]||''; }
function transparencyLbl(v){ return ['','Nublado','Maioritariamente Nublado','Parcialmente Limpo','Maioritariamente Limpo','Cristalino'][parseInt(v)]||''; }

function thisMonth(obs){
  const now = new Date();
  return obs.filter(o => {
    const d = new Date(o.date);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }).length;
}

function uniqueNights(obs){
  return new Set(obs.map(o => o.date)).size;
}

function estimateHours(obs){
  return (obs.length * 1.2).toFixed(1);
}

function obsImage(obs){
  if(!obs.image) return `<div class="gallery-placeholder">${typeIcon(obs.type)}</div>`;
  return `<img src="${obs.image}" alt="${obs.name}" onerror="this.parentNode.innerHTML='<div class=gallery-placeholder>${typeIcon(obs.type)}</div>'">`;
}

function updateBadges(){
  document.getElementById('badgeObs').textContent = observations.length;
  document.getElementById('badgeWish').textContent = wishlist.length;
}

// ── NAVIGATION ───────────────────────────────────────────────────────────────
function navigate(page){
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('onclick')===`navigate('${page}')`);
  });
  const titles = {
    dashboard:['title_dashboard','sub_dashboard'],
    observacoes:['title_obs','sub_obs'],
    objetos:['title_obj','sub_obj'],
    locais:['title_loc','sub_loc'],
    planeamento:['title_plan','sub_plan'],
    calendario:['title_cal','sub_cal'],
    estatisticas:['title_stats','sub_stats'],
    galeria:['title_gal','sub_gal'],
    diario:['title_diary','sub_diary'],
    definicoes:['title_def','sub_def'],
  };
  const [tk,sk] = titles[page]||['title_dashboard','sub_dashboard'];
  document.getElementById('topbarTitle').textContent = t(tk);
  document.getElementById('topbarSub').textContent = t(sk);
  updateBadges();
  renderPage(page);
}

function renderPage(page){
  const content = document.getElementById('mainContent');
  content.innerHTML = `<div class="page-content">${getPageHTML(page)}</div>`;
  initPageJS(page);
}

// ── PAGES ────────────────────────────────────────────────────────────────────
function getPageHTML(page){
  switch(page){
    case 'dashboard':    return pageDashboard();
    case 'observacoes':  return pageObservacoes();
    case 'objetos':      return pageObjetos();
    case 'locais':       return pageLocais();
    case 'planeamento':  return pagePlaneamento();
    case 'calendario':   return pageCalendario();
    case 'estatisticas': return pageEstatisticas();
    case 'galeria':      return pageGaleria();
    case 'diario':       return pageDiario();
    case 'definicoes':   return pageDefinicoes();
    default: return pageDashboard();
  }
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function pageDashboard(){
  const lastObs = observations.length ? observations[observations.length-1] : null;
  const totalThisMonth = thisMonth(observations);
  const nights = uniqueNights(observations);
  const hours = estimateHours(observations);
  const uniqueObj = new Set(observations.map(o => o.name)).size;

  // Top objects
  const objCount = {};
  observations.forEach(o => { objCount[o.name] = (objCount[o.name]||0)+1; });
  const topObjs = Object.entries(objCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // Years for dropdown
  const years = [...new Set(observations.map(o => o.date ? o.date.split('-')[0] : ''))].filter(Boolean).sort().reverse();
  const currentYear = new Date().getFullYear();
  if(!years.includes(String(currentYear))) years.unshift(String(currentYear));

  return `
  <!-- KPIs -->

function thisMonthNights(){
  const now = new Date();
  const dates = new Set(observations.filter(o=>{
    const d=new Date(o.date);
    return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
  }).map(o=>o.date));
  return dates.size;
}

function scoreNight(obs){
  if(!obs) return '—';
  const s = parseInt(obs.seeing)||0;
  const t2 = parseInt(obs.transparency)||0;
  if(!s&&!t2) return '—';
  const total = ((s+t2)/2)*2;
  return total.toFixed(1)+'/10';
}

function updateMonthChart(year){
  const ctx = document.getElementById('monthChart');
  if(!ctx) return;
  const months = lang==='pt'
    ? ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']
    : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const data = Array.from({length:12},(_,i)=>{
    return observations.filter(o=>{
      if(!o.date) return false;
      const d=new Date(o.date);
      return d.getFullYear()==year && d.getMonth()===i;
    }).length;
  });
  if(monthChart){ monthChart.destroy(); monthChart=null; }
  monthChart = new Chart(ctx, {
    type:'bar',
    data:{
      labels:months,
      datasets:[{
        data,
        backgroundColor:'rgba(124,109,250,.65)',
        hoverBackgroundColor:'rgba(200,155,50,.75)',
        borderRadius:6,
        borderSkipped:false,
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw} obs`}}},
      scales:{
        x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#64748b',font:{size:11}}},
        y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#64748b',font:{size:11},stepSize:1},beginAtZero:true}
      },
      onHover:(e,els)=>{ e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      onClick:(e,els)=>{
        if(!els.length) return;
        const monthIdx = els[0].index;
        const yr = parseInt(document.getElementById('yrSel')?.value||new Date().getFullYear());
        const monthObs = observations.filter(o=>{
          if(!o.date) return false;
          const d=new Date(o.date+'T12:00');
          return d.getFullYear()===yr && d.getMonth()===monthIdx;
        });
        if(!monthObs.length) return;
        const mLabel = (lang==='pt'?['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']:['January','February','March','April','May','June','July','August','September','October','November','December'])[monthIdx];
        const rows = monthObs.map(o=>{
          const ic = typeIcon(o.type,22);
          return '<div data-obsid="'+o.id+'" style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="closeModal(\'kpiModal\');showDetail('+o.id+')">'
            +'<span>'+ic+'</span>'
            +'<div style="flex:1"><div style="font-size:13px;font-weight:500;font-family:Cinzel,serif">'+o.name+'</div>'
            +'<div style="font-size:11px;color:var(--text-muted)">'+o.date+(o.location?' · '+o.location:'')+'</div></div>'
            +'<span class="badge '+typeBadgeClass(o.type)+'">'+typeLabel(o.type)+'</span>'
            +'</div>';
        }).join('');
        document.getElementById('kpiModalTitle').textContent = mLabel+' '+yr;
        document.getElementById('kpiModalBody').innerHTML = rows;
        openModal('kpiModal');
      }

    }
  });
}

async function loadWeatherForecast(){
  // Clear Outside forecast for Lisbon (38.72, -9.14)
  // Use Open-Meteo free API - no key needed, astronomy-relevant params
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=38.72&longitude=-9.14&hourly=temperature_2m,windspeed_10m,cloudcover,visibility&daily=precipitation_sum&forecast_days=1&timezone=Europe%2FLisbon';
    const res = await fetch(url);
    const data = await res.json();
    // Get tonight values (hour 22:00 = index 22)
    const h = data.hourly;
    const idx = 22; // 22h tonight
    const clouds = h.cloudcover[idx];
    const temp = h.temperature_2m[idx];
    const wind = h.windspeed_10m[idx];
    const vis = h.visibility[idx];
    
    // Seeing estimate based on wind and clouds
    const seeingVal = clouds < 20 && wind < 10 ? 'Excelente' : clouds < 50 && wind < 20 ? 'Bom' : clouds < 70 ? 'Razoável' : 'Mau';
    const transpVal = clouds < 10 ? 'Cristalino' : clouds < 30 ? 'Maioritariamente Limpo' : clouds < 60 ? 'Parcialmente Limpo' : 'Nublado';
    
    // Score 0-10
    const score = Math.max(0, Math.round(10 - (clouds/15) - (wind/8))).toFixed(1);
    
    const setEl = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
    setEl('condClouds', clouds + '% nuvens');
    setEl('condSeeing', seeingVal);
    setEl('condTransp', transpVal);
    setEl('condTemp', temp.toFixed(1) + '°C');
    setEl('condWind', wind.toFixed(0) + ' km/h');
    setEl('condScore', score + '/10');
    
    // Color code score
    const scoreEl = document.getElementById('condScore');
    if(scoreEl) scoreEl.style.color = score >= 7 ? 'var(--teal)' : score >= 4 ? 'var(--gold)' : 'var(--danger)';
    // Update ring conic gradient based on score
    const ringEl = document.getElementById('condRing');
    if(ringEl){
      const pct = Math.round(score * 10);
      const col = score >= 7 ? 'var(--teal)' : score >= 4 ? 'var(--gold)' : 'var(--danger)';
      ringEl.style.background = `conic-gradient(${col} 0% ${pct}%, var(--border) ${pct}% 100%)`;
    }
  } catch(e) {
    const el = document.getElementById('condClouds');
    if(el) el.textContent = 'Sem dados';
    console.warn('Weather fetch failed:', e);
  }
}

function obsCardHTML(obs){
  const fallbackIcon = typeIcon(obs.type, 48);
  return `<div class="obs-card" onclick="showDetail(${obs.id})">
    <div class="obs-card-img">
      ${obs.image
        ? '<img src="'+obs.image+'" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'">'
        : fallbackIcon}
    </div>
    <div class="obs-card-body">
      <div style="display:flex;align-items:start;justify-content:space-between">
        <div class="obs-card-name">${obs.name}</div>
        ${obs.favorite?`<span class="obs-star">⭐</span>`:''}
      </div>
      <div style="margin-bottom:6px"><span class="badge ${typeBadgeClass(obs.type)}">${typeLabel(obs.type)}</span></div>
      <div class="obs-card-meta">
        📅 ${obs.date}${obs.location?`<br>📍 ${obs.location}`:''}
        ${obs.seeing?`<br><span class="stars">${starsDisp(obs.seeing)}</span>`:''}
        ${obs.equipment?`<br>${typeIcon(obs.type,14)} ${obs.equipment}`:''}
      </div>
    </div>
  </div>`;
}

// ── LOCAIS ───────────────────────────────────────────────────────────────────
function pageLocais(){
  const locMap = {};
  observations.forEach(o => {
    if(!o.location) return;
    if(!locMap[o.location]) locMap[o.location]={count:0,types:new Set(),dates:[]};
    locMap[o.location].count++;
    locMap[o.location].types.add(o.type);
    locMap[o.location].dates.push(o.date);
  });
  const locs = Object.entries(locMap).sort((a,b)=>b[1].count-a[1].count);

  return `
  <div class="section-header">
    <div class="section-title">${t('title_loc')} <span style="color:var(--text-muted);font-size:15px">(${locs.length})</span></div>
  </div>
  ${locs.length===0 ? `<div class="empty"><div class="empty-icon">📍</div><div class="empty-text">${t('loc_no_obs')}</div></div>` : `
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:24px">
    ${locs.map(([loc,d]) => {
      const safeL = loc.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      return `
    <div class="loc-card" onclick="fSrch='${safeL}';nav('observacoes')">
      <div class="loc-icon">📍</div>
      <div style="flex:1">
        <div class="loc-name">${loc}</div>
        <div class="loc-meta">${[...d.types].map(typeLabel).join(', ')}</div>
        <div class="loc-meta">${lang==='pt'?'Última':'Last'}: ${d.dates.sort().reverse()[0]}</div>
      </div>
      <div class="loc-count">
        <div class="loc-count-num">${d.count}</div>
        <div class="loc-count-lbl">obs</div>
      </div>
    </div>`;
    }).join('')}
  </div>`}
  <div class="card">
    <div class="card-title">${lang==='pt'?'Recursos de Localização':'Location Resources'}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a href="https://www.lightpollutionmap.info/" target="_blank" class="btn btn-secondary">🌃 Light Pollution Map</a>
      <a href="https://clearoutside.com/" target="_blank" class="btn btn-secondary">☁️ Clear Outside</a>
      <a href="https://www.meteoblue.com/" target="_blank" class="btn btn-secondary">🌤️ Meteoblue</a>
    </div>
  </div>`;
}

  searchQ = loc;

      <div class="card-title">🌤️ Clear Outside</div>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px">${lang==='pt'?'Previsão específica para astronomia — nebulosidade, humidade, vento e transparência.':'Astronomy-specific forecast — cloud cover, humidity, wind, and transparency.'}</div>

function wishCardHTML(item){
  const pColor = {high:'#ef4444',medium:'#f59e0b',low:'#22c55e'};
  const pLabel = {
    pt:{high:'Alta',medium:'Média',low:'Baixa'},
    en:{high:'High',medium:'Medium',low:'Low'}
  };
  return `<div class="wish-card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <div class="priority-dot" style="background:${pColor[item.priority]}"></div>
      <div style="font-weight:600;font-size:14px;flex:1">${item.name}</div>
      <span class="badge ${typeBadgeClass(item.type)}">${typeLabel(item.type)}</span>
    </div>
    ${item.notes?`<div style="font-size:12px;color:var(--text-dim);margin-bottom:10px">${item.notes}</div>`:''}
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">${lang==='pt'?'Prioridade':'Priority'}: ${(pLabel[lang]||pLabel.pt)[item.priority]} · ${item.dateAdded?item.dateAdded.split('T')[0]:''}</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary btn-sm" style="flex:1" onclick="moveToObs(${item.id})">${t('mark_obs')}</button>
      <button class="btn btn-danger btn-sm btn-icon" onclick="deleteWish(${item.id})">🗑️</button>
    </div>
  </div>`;
}

function moveToObs(id){
  const item = wishlist.find(w=>w.id===id);
  if(!item) return;
  wishlist = wishlist.filter(w=>w.id!==id); saveWL();
  openAddModal();
  setTimeout(()=>{
    document.getElementById('fName').value = item.name;
    document.getElementById('fType').value = item.type;
    document.getElementById('fDesc').value = item.notes||'';
  },100);
}

function deleteWish(id){
  wishlist = wishlist.filter(w=>w.id!==id); saveWL();
  navigate('planeamento');
  toast(lang==='pt'?'Item removido':'Item removed');
}

    const dayObs = getObsForDay(d);
    const dayEvs = getEvForDay(d);
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    // Tooltip content
    let tipParts = [];
    dayObs.forEach(o=>tipParts.push(o.name));
    dayEvs.forEach(e=>tipParts.push(e.name));
    const tip = tipParts.length ? ` title="${tipParts.join(' | ')}"` : '';

    // Mini event icons on the day cell
    const evDots = dayEvs.map(e=>
      '<img src="'+e.img+'" style="width:26px;height:26px;object-fit:contain;margin:1px;filter:drop-shadow(0 0 3px rgba(255,255,255,.25))" title="'+e.name+'">').join('');
    const obsDots = dayObs.length
      ? '<div style="width:6px;height:6px;border-radius:50%;background:var(--teal);margin:1px;display:inline-block" title="'+dayObs.map(o=>o.name).join(', ')+'"></div>'
      : '';

    calCells+='<div class="cal-day '+
      (isToday?'today ':'')+
      (dayObs.length?'has-obs ':'')+
      (dayEvs.length?'has-event ':'')+
      '" onclick="selectCalDay('+d+')"'+ tip +'>'+
      '<div style="font-size:11px;font-weight:500;margin-bottom:2px">'+d+'</div>'+
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:1px;min-height:18px">'+evDots+obsDots+'</div>'+
      '</div>';
  }

  return `
  <div style="display:grid;grid-template-columns:1fr 340px;gap:16px">
    <!-- Calendar (smaller) -->
    <div class="card" style="max-width:520px">
      <div class="cal-header">
        <div class="cal-nav" onclick="calNav(-1)">‹</div>
        <div class="cal-month">${months[month]} ${year}</div>
        <div class="cal-nav" onclick="calNav(1)">›</div>
      </div>
      <div class="cal-grid" style="font-size:11px">
        ${days.map(d=>`<div class="cal-day-label" style="font-size:10px">${d}</div>`).join('')}
        ${calCells}
      </div>
      <div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--text-muted);align-items:center">
        <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block"></span> Observação</span>
        <span style="display:flex;align-items:center;gap:4px"><img src="${window._calEvents[0]?window._calEvents[0].img:''}" style="width:14px;height:14px;object-fit:contain"> Evento</span>
      </div>
    </div>

    <!-- Right panel -->
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card" id="dayDetail">
        <div class="card-title" style="margin-bottom:8px">${lang==='pt'?'Seleciona um dia':'Select a day'}</div>
        <div style="font-size:12.5px;color:var(--text-muted)">${lang==='pt'?'Clica num dia para ver observações e eventos.':'Click a day to see observations and events.'}</div>
      </div>
      <div class="card">
        <div class="card-title">${t('next_events')}</div>
        ${window._calEvents.filter(e=>new Date(e.date)>=new Date()).slice(0,6).map(ev=>`
        <div class="event-row" style="cursor:pointer;border-radius:8px;padding:8px 4px;transition:background .15s" onmouseover="this.style.background='rgba(200,155,50,.06)'" onmouseout="this.style.background='transparent'" onclick="openCalEvent(${window._calEvents.indexOf(ev)})">
          <div class="event-icon" style="background:none;padding:0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <img src="${ev.img}" style="width:38px;height:38px;object-fit:contain">
          </div>
          <div style="flex:1">
            <div class="event-name" style="font-size:12.5px;font-weight:600">${ev.name}</div>
            <div class="event-date" style="font-size:11px;color:var(--text-muted)">${ev.date}</div>
          </div>
          <div style="color:rgba(200,155,50,.4);font-size:16px">›</div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}


function calNav(dir){
  calDate = new Date(calDate.getFullYear(), calDate.getMonth()+dir, 1);
  navigate('calendario');
}
function selectCalDay(d){
  selectedCalDay = d;
  const year = calDate.getFullYear(), month = calDate.getMonth();
  const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const obs = observations.filter(o=>o.date===ds);
  const detail = document.getElementById('dayDetail');
  if(!detail) return;
  detail.innerHTML = `<div class="card-title">${ds}</div>
    ${obs.length ? obs.map(o=>`
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="showDetail(${o.id})">
        <span style="font-size:20px">${typeIcon(o.type)}</span>
        <div>
          <div style="font-weight:600;font-size:13px">${o.name}</div>
          <div style="font-size:11px;color:var(--text-muted)">${typeLabel(o.type)}${o.location?' · '+o.location:''}</div>
        </div>
      </div>`).join('') :
    `<div style="font-size:13px;color:var(--text-muted)">${lang==='pt'?'Sem observações neste dia.':'No observations on this day.'}</div>`}`;
}

      observations.filter(o=>o.location).forEach(o=>{ locCounts[o.location]=(locCounts[o.location]||0)+1; });

          <span style="font-weight:600;color:var(--accent2)">${n}×</span>
        </div>`).join('')}
      </div>`;
    })()}
  </div>`}`;
}

function pageGaleria(){
  const withImg = observations.filter(o=>o.image);

  // Build type filter buttons
  const typeGroups = {};
  withImg.forEach(o=>{ typeGroups[o.type]=(typeGroups[o.type]||0)+1; });

  function galCards(obs){
    if(!obs.length) return '<div class="empty"><div class="empty-icon"><img src="'+OBJ_ICONS['other']+'" style="width:56px;height:56px;object-fit:contain;opacity:.4"></div><div class="empty-text">'+(lang==='pt'?'Sem imagens para este filtro':'No images for this filter')+'</div></div>';
    return obs.map(o=>
      '<div class="gal-card" onclick="openGalImg('+o.id+')">'
      +'<div class="gal-img-wrap">'
      +'<img src="'+o.image+'" alt="'+o.name+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">'
      +'<div class="gal-overlay">'
      +'<div style="font-size:12.5px;font-weight:600;color:#fff;font-family:Cinzel,serif">'+o.name+'</div>'
      +'<div style="font-size:11px;color:rgba(255,255,255,.55);margin-top:2px">'+(o.date||'')+(o.location?' · '+o.location:'')+'</div>'
      +'</div></div></div>'
    ).join('');
  }

  if(withImg.length===0) return `
  <div class="section-header"><div class="section-title">${t('title_gal')}</div></div>
  <div class="empty">
    <div class="empty-icon"><img src="${OBJ_ICONS['other']}" style="width:56px;height:56px;object-fit:contain;opacity:.4"></div>
    <div class="empty-text">${lang==='pt'?'Sem imagens':'No images'}</div>
    <div class="empty-sub">${lang==='pt'?'Adiciona imagens às tuas observações':'Add images to your observations'}</div>
  </div>`;

  return `
  <div class="section-header">
    <div class="section-title">${t('title_gal')} <span style="color:var(--text-muted);font-size:13px">(${withImg.length})</span></div>
  </div>
  <div class="filter-bar" style="margin-bottom:14px">
    <button class="filter-btn active" onclick="galFilter('all',this)">${lang==='pt'?'Todos':'All'} (${withImg.length})</button>
    ${Object.entries(typeGroups).map(([tp,n])=>'<button class="filter-btn" onclick="galFilter(\''+tp+'\',this)">'+typeIcon(tp,16)+' '+typeLabel(tp)+' ('+n+')</button>').join('')}
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px" id="galGrid">
    ${galCards(withImg)}
  </div>
  <!-- Fullscreen -->
  <div id="galFullscreen" onclick="closeGal()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:9999;align-items:center;justify-content:center;flex-direction:column">
    <button onclick="closeGal();event.stopPropagation()" style="position:absolute;top:18px;right:22px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:22px;cursor:pointer;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s" onmouseover="this.style.background='rgba(255,255,255,.2)'" onmouseout="this.style.background='rgba(255,255,255,.1)'">✕</button>
    <div style="position:absolute;top:18px;left:22px">
      <div id="galFsName" style="font-family:Cinzel,serif;font-size:15px;color:#e8b84b;letter-spacing:.1em"></div>
      <div id="galFsDate" style="font-size:11px;color:rgba(255,255,255,.45);margin-top:3px"></div>
    </div>
    <img id="galFsImg" src="" onclick="event.stopPropagation()" style="max-width:88vw;max-height:85vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 60px rgba(0,0,0,.9)">
    <div style="position:absolute;bottom:18px;font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.1em">${lang==='pt'?'CLIQUE PARA FECHAR':'CLICK TO CLOSE'}</div>
  </div>`;
}

function galFilter(type, btn){
  document.querySelectorAll('.gal-filter-btn, .filter-bar .filter-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const obs = type==='all' ? observations.filter(o=>o.image) : observations.filter(o=>o.image&&o.type===type);
  const grid = document.getElementById('galGrid');
  if(!grid) return;
  if(!obs.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div style="color:var(--text-muted);font-size:13px;padding:30px;text-align:center">'+(lang==='pt'?'Sem imagens para este tipo':'No images for this type')+'</div></div>';
    return;
  }
  grid.innerHTML = obs.map(o=>
    '<div class="gal-card" onclick="openGalImg('+o.id+')">'
    +'<div class="gal-img-wrap">'
    +'<img src="'+o.image+'" alt="'+o.name+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">'
    +'<div class="gal-overlay">'
    +'<div style="font-size:12.5px;font-weight:600;color:#fff;font-family:Cinzel,serif">'+o.name+'</div>'
    +'<div style="font-size:11px;color:rgba(255,255,255,.55);margin-top:2px">'+(o.date||'')+(o.location?' · '+o.location:'')+'</div>'
    +'</div></div></div>'
  ).join('');
}


function openGalImg(id){
  const o = observations.find(x=>x.id===id);
  if(!o||!o.image) return;
  // The fullscreen div is inside the page content — find it
  const fs = document.getElementById('galFullscreen');
  if(!fs) return;
  document.getElementById('galFsImg').src = o.image;
  document.getElementById('galFsName').textContent = o.name;
  document.getElementById('galFsDate').textContent = (o.date||'')+(o.location?' · '+o.location:'');
  fs.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeGal(){
  const fs = document.getElementById('galFullscreen');
  if(fs) fs.style.display = 'none';
  document.body.style.overflow = '';
}

function saveQuickNote(){
  const note = document.getElementById('quickNote').value.trim();
  if(!note) return;
  const notes = JSON.parse(localStorage.getItem('quickNotes')||'[]');
  notes.unshift({text:note, date:new Date().toISOString()});
  localStorage.setItem('quickNotes', JSON.stringify(notes));
  document.getElementById('quickNote').value='';
  renderSavedNotes();
  toast(lang==='pt'?'Nota guardada':'Note saved');
}

function renderSavedNotes(){
  const el = document.getElementById('savedNotes');
  if(!el) return;
  const notes = JSON.parse(localStorage.getItem('quickNotes')||'[]');
  if(!notes.length){
    el.innerHTML='<div style="font-size:12px;color:var(--text-muted);padding:8px 0">'+(lang==='pt'?'Sem notas guardadas.':'No saved notes.')+'</div>';
    return;
  }
  el.innerHTML = '<div style="font-size:10.5px;color:rgba(200,155,50,.5);margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase">'+(lang==='pt'?'Notas guardadas:':'Saved notes:')+'</div>'
    + notes.map((n,i)=>
      '<div onclick="openNoteModal('+i+')" style="display:flex;align-items:center;gap:10px;background:var(--bg-hover);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer;transition:border-color .15s" onmouseover="this.style.borderColor=\'rgba(200,155,50,.4)\'" onmouseout="this.style.borderColor=\'var(--border)\'">'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:9.5px;color:rgba(200,155,50,.45);margin-bottom:2px;letter-spacing:.06em">'+n.date.split('T')[0]+'</div>'

async function autofillObject(){
  const name = document.getElementById('fName').value.trim();
  if(!name){ toast(lang==='pt'?'Introduz um nome primeiro':'Enter a name first','error'); return; }
  const btn = document.getElementById('autofillBtn');
  btn.disabled=true; btn.textContent='⏳ A carregar...';
  try {
    const wikiRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`);
    const wiki = wikiRes.ok ? await wikiRes.json() : null;
    if(wiki?.extract){
      document.getElementById('fDesc').value = wiki.extract.split('. ').slice(0,3).join('. ')+'.';
    }
    if(wiki?.thumbnail?.source){
      document.getElementById('imgPreview').src = wiki.thumbnail.source;
      document.getElementById('imgPreviewWrap').style.display='block';
    }
    const q1 = `SELECT b.ra,b.dec,b.plx_value FROM basic b JOIN ident i ON i.oidref=b.oid WHERE i.id='${name}' LIMIT 1`;
    const r1 = await fetch(`https://simbad.cds.unistra.fr/simbad/sim-tap/sync?REQUEST=doQuery&LANG=ADQL&FORMAT=json&QUERY=${encodeURIComponent(q1)}`);
    const d1 = r1.ok ? await r1.json() : null;
    if(d1?.data?.[0]){
      const [ra,dec,plx]=d1.data[0];
      if(ra!=null){const h=Math.floor(ra/15);const m=Math.floor((ra/15-h)*60);const s=((ra/15-h)*60-m)*60;document.getElementById('fRA').value=`${String(h).padStart(2,'0')}h${String(m).padStart(2,'0')}m${s.toFixed(1).padStart(4,'0')}s`;}
      if(dec!=null){const sign=dec<0?'-':'+';const a=Math.abs(dec);const d2=Math.floor(a);const dm=Math.floor((a-d2)*60);const ds=((a-d2)*60-dm)*60;document.getElementById('fDec').value=`${sign}${String(d2).padStart(2,'0')}°${String(dm).padStart(2,'0')}'${ds.toFixed(0).padStart(2,'0')}"`;}
      if(plx!=null&&plx>0){const ly=(1000/plx)*3.26156;if(ly<1000000){document.getElementById('fDist').value=ly.toFixed(0);document.getElementById('fDistUnit').value='ly';}else{document.getElementById('fDist').value=(ly/1000000).toFixed(1);document.getElementById('fDistUnit').value='Mly';}}
    }
    const q2=`SELECT f.flux FROM flux f JOIN ident i ON i.oidref=f.oidref WHERE i.id='${name}' AND f.filter='V' LIMIT 1`;
    const r2=await fetch(`https://simbad.cds.unistra.fr/simbad/sim-tap/sync?REQUEST=doQuery&LANG=ADQL&FORMAT=json&QUERY=${encodeURIComponent(q2)}`);
    const d2=r2.ok?await r2.json():null;
    if(d2?.data?.[0]?.[0]!=null) document.getElementById('fMag').value=Number(d2.data[0][0]).toFixed(1);
    toast(lang==='pt'?'✅ Dados carregados!':'✅ Data loaded!');
  } catch(e){ toast(lang==='pt'?'Não foi possível carregar dados':'Could not load data','error'); }
  btn.disabled=false; btn.textContent='🔍 Auto-fill';
}

function handleImageUpload(e){
  const file = e.target.files?.[0];
  if(!file) return;
  if(file.size>8*1024*1024){ toast(lang==='pt'?'Imagem demasiado grande (max 8MB)':'Image too large (max 8MB)','error'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const max=900; let {width,height}=img;
      if(width>height&&width>max){height=Math.round(height*max/width);width=max;}
      else if(height>max){width=Math.round(width*max/height);height=max;}
      canvas.width=width;canvas.height=height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      const src=canvas.toDataURL('image/jpeg',.78);
      document.getElementById('imgPreview').src=src;
      document.getElementById('imgPreviewWrap').style.display='block';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

      else if(data.observations){observations=data.observations;save();if(data.wishlist){wishlist=data.wishlist;saveWL();}toast(lang==='pt'?'Backup restaurado':'Backup restored');}

      +'<div style="flex:1"><div style="font-size:13px;font-weight:500">'+o.name+'</div>'
      +'<div style="font-size:11px;color:var(--text-muted)">'+o.date+(o.location?' · '+o.location:'')+'</div></div>'
      +'<span class="badge '+typeBadgeClass(o.type)+'">'+typeLabel(o.type)+'</span>'
      +'</div>'
    ).join('');
  } else if(type==='hours'){
    const sorted = observations.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    rows = sorted.map(o=>
      '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">'
      +'<span>'+typeIcon(o.type,24)+'</span>'
      +'<div style="flex:1"><div style="font-size:13px;font-weight:500">'+o.name+'</div>'
      +'<div style="font-size:11px;color:var(--text-muted)">'+o.date+'</div></div>'
      +'<span style="font-size:12px;color:var(--text-dim)">'+(o.duration||o.timeStart||(lang==='pt'?'~1h':'~1h'))+'</span>'
      +'</div>'
    ).join('');
  } else if(type==='objects'){
    const objMap={};
    observations.forEach(o=>{if(!objMap[o.name])objMap[o.name]={count:0,type:o.type};objMap[o.name].count++;});

      +'<span style="font-size:12px;color:var(--accent2);font-weight:600">'+d.count+'×</span>'
      +'</div>'

function updateTypeIcon(type) {
  const img = document.getElementById('fTypeIcon');
  if(img && TYPE_ICONS_MAP[type]) img.src = TYPE_ICONS_MAP[type];
}
function openCalEvent(idx2){
  const ev = window._calEvents && window._calEvents[idx2];
  if(!ev) return;
  openEventModal(ev);
}
function openEventModal(ev){
  const wikiMap = {
    'Perseidas':'https://pt.wikipedia.org/wiki/Perseidas',
    'Lua Cheia':'https://pt.wikipedia.org/wiki/Lua_cheia',
    'Eclipse Lunar Total':'https://pt.wikipedia.org/wiki/Eclipse_lunar',
    'Equinócio de Outono':'https://pt.wikipedia.org/wiki/Equin%C3%B3cio',
    'Orionidas':'https://pt.wikipedia.org/wiki/Ori%C3%B4nidas',
    'Superlua':'https://pt.wikipedia.org/wiki/Superlua',
    'Gemínidas':'https://pt.wikipedia.org/wiki/Gem%C3%ADnidas',
    'Solstício de Inverno':'https://pt.wikipedia.org/wiki/Solst%C3%ADcio',
  };
  const wikiUrl = wikiMap[ev.name] || ('https://pt.wikipedia.org/wiki/'+encodeURIComponent(ev.name));
  document.getElementById('evModalTitle').textContent = ev.name;
  document.getElementById('evModalBody').innerHTML =
    '<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0">'
    +'<img src="'+ev.img+'" style="width:100px;height:100px;object-fit:contain">'
    +'<div style="font-size:13.5px;color:var(--text-dim);text-align:center;line-height:1.8">'+ev.desc+'</div>'
    +'<div style="font-size:12px;color:rgba(200,155,50,.55);letter-spacing:.08em">📅 '+ev.date+'</div>'
    +'<a href="'+wikiUrl+'" target="_blank" class="wiki-link">'
    +'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>'
    +' Saber mais — Wikipedia</a>'
    +'</div>';
  openModal('evModal');
}

document.addEventListener('DOMContentLoaded', ()=>{
  // Global error handler
  window.onerror = (msg, src, line) => {
    const el = document.getElementById('mainContent');
    if(el && el.innerHTML.trim() === '') {
      el.innerHTML = '<div style="padding:30px;color:#ef4444;font-family:monospace"><b>Erro:</b><br>'+msg+'<br><small>linha '+line+'</small></div>';
    }
    console.error('AstroLogs Error:', msg, 'line:', line);
    return false;
  };

  const _uname = localStorage.getItem('astro_username')||'Mendreas';
  const _urole = localStorage.getItem('astro_role')||'Explorador do Céu';
  const _uinit = _uname[0].toUpperCase();
  // Topbar user
  const _tbn = document.getElementById('userNameTopbar');
  const _tbr = document.getElementById('userRoleTopbar');
  const _tba = document.getElementById('userAvatarTopbar');
  if(_tbn) _tbn.textContent = _uname;
  if(_tbr) _tbr.textContent = _urole;
  if(_tba) _tba.textContent = _uinit;
  updateBadges();
  navigate('dashboard');

  // Close modals on overlay click
  document.querySelectorAll('.modal-overlay').forEach(m=>{
    m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('open'); });
  });
  // ESC closes modals
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open'));
      closeGal();
    }
  });
});
</script>
